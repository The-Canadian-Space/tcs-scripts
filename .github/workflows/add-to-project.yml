# Auto-add every newly opened issue + PR in this repo to the
# TCS Timeline project board (org/The-Canadian-Space/projects/1).
#
# Uses the `TCS_WORKFLOW_TOKEN` secret — org-level for public repos,
# repo-level for private repos (Chris's plan doesn't allow org secrets
# to reach private repos).
#
# The referenced PAT needs org projects: read/write. Rollout tracked
# in the ad-hoc auto-add-to-project effort (no ticket — one-shot infra).

name: Add to TCS project

on:
  issues:
    types: [opened]
  # tcs-docs#218 (2026-09-25): `pull_request` removed deliberately.
  #
  # The changelog bot opens its PRs on bot/changelog using GITHUB_TOKEN, and
  # GitHub does not execute workflow runs triggered that way - the recursion
  # barrier. It still RECORDS a run, which lands as a failure with zero jobs
  # dispatched, so this workflow produced ~13 red runs in 7 days across this
  # repo, tcs-scripts and tcs-public-wiki.
  #
  # A job-level `if: github.actor != 'github-actions[bot]'` cannot fix it:
  # no job is ever dispatched, so the condition is never evaluated.
  #
  # Nothing is lost. Across all four repos, zero issues and zero human-opened
  # PRs have ever failed to reach the board - only bot PRs, which do not want
  # cards. Issues are what the board is for.

permissions:
  contents: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/The-Canadian-Space/projects/1
          github-token: ${{ secrets.TCS_WORKFLOW_TOKEN }}
