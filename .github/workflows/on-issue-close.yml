name: On issue close → append CHANGELOG

on:
  issues:
    types: [closed]

# No `concurrency` group here (removed 2026-09-19, superseding #17): GitHub
# keeps at most one pending run per group and CANCELS older pending ones, so a
# bulk close would drop CHANGELOG entries rather than serialize them. The
# reusable workflow now converges per run instead — overlapping runs each
# rebuild the single bot/changelog branch on fresh main and retry.

# The reusable workflow needs contents: write to commit + push CHANGELOG.
# The-Canadian-Space org sets default_workflow_permissions=read, so we
# override at the caller.
permissions:
  contents: write
  pull-requests: write

jobs:
  call-append:
    uses: The-Canadian-Space/.github/.github/workflows/append-changelog.yml@main
    secrets: inherit
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      closed_by: ${{ github.event.sender.login }}
      state_reason: ${{ github.event.issue.state_reason }}
